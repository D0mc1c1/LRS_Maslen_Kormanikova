# indoor_mission (A1.2). Kazdy parameter sa da prepisat: -p nazov:=hodnota
/**:
  ros__parameters:
    # --- misia ---
    mission_file: ""                 # CSV misia (povinne)
    planner: "astar"                 # astar | straight (priamky bez kolizii)

    # --- planovac A1.1 ---
    map_path: "/home/user/LRS-URK/maps/FEI_LRS_PCD/map.pcd"
    voxel_size: 0.10                 # [m] velkost bunky mriezky
    inflation_radius: 0.70           # [m] dron 0.3 + rezerva 0.4 (max 0.8, inak WP v prekazke)
    max_flight_z: 3.0                # [m] bez neho leti ponad regaly
    # regal A a regal B, kazdy [x_min, y_min, z_min, x_max, y_max, z_max] v mape
    rack_boxes: [1.07, 6.29, 0.0, 7.57, 7.34, 4.10,
                 1.07, 10.84, 0.0, 7.57, 11.89, 4.10]
    viz_max_z: 4.0                   # [m] RViz: voxely vyssie = priesvitna strecha

    # --- ramce: mapa -> MAVROS local ---
    local_from_map_yaw_deg: 90.0     # otocenie, lebo Gazebo X = sever (map (13,7) = local (-7,13))
    local_from_map_xyz: [0.0, 0.0, 0.0]   # posun
    yaw_task_frame: "map"            # uhol yawN v CSV: map (0 = +X mapy) | enu (0 = vychod)

    setpoint_rate: 20.0              # [Hz] krok automatu a setpoint

    # --- prichod na bod ---
    tol_hard: 0.15                   # [m] hard waypoint ...
    v_settle: 0.10                   # [m/s] ... pomalsie ako toto ...
    settle_time: 1.0                 # [s] ... nepretrzite tak dlho
    tol_soft: 0.50                   # [m] soft waypoint, prelet bez zastavenia
    tol_pass: 0.40                   # [m] medzibod z planovaca, prelet bez zastavenia

    # --- natocenie ---
    yaw_tol_deg: 5.0                 # [deg] tolerancia uhla
    yaw_hold_time: 1.0               # [s] yawN: tak dlho drzat uhol
    min_leg_xy: 0.20                 # [m] kratsi usek je zvisly, yaw sa nemeni

    # --- vzlet, pristatie, timeouty ---
    takeoff_tol: 0.15                # [m] vzlet hotovy pri z >= ciel - 0.15
    landtakeoff_wait: 3.0            # [s] landtakeoff: pauza na zemi
    arm_timeout: 60.0                # [s] max cakanie na arm
    segment_timeout: 120.0           # [s] max cas jedneho useku

    # --- bezpecnost (abort = LAND, pilot alebo vypadok = program prestane riadit) ---
    state_timeout: 3.0               # [s] bez /mavros/state = strata spojenia
    pose_timeout: 1.0                # [s] bez polohy = strata spojenia